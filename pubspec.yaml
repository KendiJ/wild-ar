name: wild_ar
description: "A production-grade Flutter AR application with Ground-Anchored Chroma-Key AR Video Planes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  arkit_plugin: ^1.1.0
  video_player: ^2.9.2
  permission_handler: ^11.3.1
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/earth.jpeg
    - assets/images/earth.jpg
    - assets/images/globe.jpeg
    - assets/videos/migration1.mp4
    - assets/videos/migration2.MP4
    - assets/images/kicc.png
    - assets/images/KICC.jpeg